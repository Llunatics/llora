<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    LLORA MARK — "the cultivated hour"
    A cinnabar enso: the circle of a day, brushed in one breath.
    A leaf caps its opening; 集中 (focus) rests within.
    Time is not chased — it is cultivated.
  -->
  <defs>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F1E3"/>
      <stop offset="1" stop-color="#EFE7D3"/>
    </linearGradient>
  </defs>

  <!-- cream ground -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="url(#cream)"/>

  <!-- red minute ticks -->
  <circle cx="256" cy="268" r="172" fill="none" stroke="#A83A2A"
          stroke-width="5" stroke-dasharray="3 15.01" opacity="0.75"/>

  <!-- cinnabar enso -->
  <path d="M 326 147 A 140 140 0 1 0 326 389"
        fill="none" stroke="#A83A2A" stroke-width="38" stroke-linecap="round"/>
  <!-- dry-brush texture -->
  <path d="M 326 147 A 140 140 0 1 0 326 389"
        fill="none" stroke="#7E2A1E" stroke-width="38" stroke-linecap="round"
        stroke-dasharray="60 40 25 55 90 35" opacity="0.3"/>
  <path d="M 326 147 A 140 140 0 1 0 326 389"
        fill="none" stroke="#C0522F" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="150 300 80 200" opacity="0.35"/>
  <!-- tapering tail, flicking along the stroke's tangent -->
  <path d="M 310 373 L 320 402 L 370 370 Z" fill="#A83A2A"/>

  <!-- the leaf capping the opening -->
  <g>
    <path d="M 330 150 Q 346 106 382 72 Q 354 110 330 150 Z" fill="#8A9A5B"/>
    <path d="M 336 142 Q 354 110 376 80" fill="none"
          stroke="#5F7046" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 集中 — focus -->
  <text x="352" y="272" text-anchor="middle"
        font-family="Noto Serif CJK SC, serif" font-weight="bold" font-size="84"
        fill="#1A1A1A">集</text>
  <text x="352" y="362" text-anchor="middle"
        font-family="Noto Serif CJK SC, serif" font-weight="bold" font-size="84"
        fill="#1A1A1A">中</text>

  <!-- LLORA, vertical -->
  <text x="292" y="238" text-anchor="middle"
        font-family="Georgia, serif" font-size="19" letter-spacing="2"
        fill="#1A1A1A">
    <tspan x="292" dy="0">L</tspan><tspan x="292" dy="24">L</tspan><tspan x="292" dy="24">O</tspan><tspan x="292" dy="24">R</tspan><tspan x="292" dy="24">A</tspan>
  </text>

  <!-- FOCUS TIMER along the lower inner arc -->
  <path id="lowarc" d="M 175 350 Q 240 382, 300 360" fill="none"/>
  <text font-family="Georgia, serif" font-size="15" letter-spacing="1.5" fill="#1A1A1A">
    <textPath href="#lowarc" startOffset="50%" text-anchor="middle">FOCUS TIMER</textPath>
  </text>

  <!-- hanko seal -->
  <rect x="392" y="398" width="46" height="46" rx="7" fill="#A83A2A"/>
  <text x="415" y="431" text-anchor="middle"
        font-family="Noto Serif CJK SC, serif" font-weight="bold" font-size="30"
        fill="#F5F0E1">時</text>
</svg>
