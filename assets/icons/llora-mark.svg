<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    LLORA MARK — "one leaf, one thing"
    A single leaf holding a single point of light: your one thing today.
    Whole attention, for one thing. Nothing else.
  -->
  <defs>
    <linearGradient id="leafg" x1="310" y1="140" x2="200" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#46F493"/>
      <stop offset="0.55" stop-color="#2EE57D"/>
      <stop offset="1" stop-color="#129A54"/>
    </linearGradient>
  </defs>

  <!-- the leaf -->
  <path d="M 310 140 C 200 160, 150 260, 200 390 C 250 375, 330 280, 310 140 Z"
        fill="url(#leafg)"/>
  <!-- light catching its edge -->
  <path d="M 298 152 C 240 200, 210 280, 218 360"
        fill="none" stroke="#D6F9E3" stroke-width="10"
        stroke-linecap="round" opacity="0.45"/>
  <!-- the one thing: a breath away from the leaf's tip -->
  <circle cx="336" cy="114" r="30" fill="#E0F9EB"/>
</svg>
