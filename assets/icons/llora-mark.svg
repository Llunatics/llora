<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    LLORA MARK — "time, grown"
    A quiet clock ring in olive gold; a single leaf rising from its edge.
    The 時 (time) rests inside: time is not chased, it is cultivated.
  -->
  <defs>
    <linearGradient id="olive" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6E3F"/>
      <stop offset="0.55" stop-color="#C8AE5D"/>
      <stop offset="1" stop-color="#8A7A44"/>
    </linearGradient>
    <radialGradient id="shdw" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft grounding shadow -->
  <ellipse cx="256" cy="432" rx="132" ry="15" fill="url(#shdw)"/>

  <!-- clock ring -->
  <circle cx="256" cy="250" r="150" fill="none" stroke="url(#olive)" stroke-width="5"/>
  <!-- minute ticks -->
  <circle cx="256" cy="250" r="132" fill="none" stroke="url(#olive)"
          stroke-width="6" stroke-dasharray="2.5 11.323" opacity="0.9"/>
  <!-- cardinal ticks -->
  <g stroke="url(#olive)" stroke-width="6" stroke-linecap="round">
    <path d="M 256 108 L 256 128"/>
    <path d="M 398 250 L 378 250"/>
    <path d="M 256 392 L 256 372"/>
    <path d="M 114 250 L 134 250"/>
  </g>

  <!-- the leaf, rising from the clock's edge -->
  <g fill="none" stroke="url(#olive)" stroke-linecap="round">
    <path d="M 142 415 C 152 352, 182 302, 216 268" stroke-width="7"/>
    <path d="M 216 268 C 198 218, 218 168, 260 128 C 252 182, 240 230, 216 268 Z"
          stroke-width="7" stroke-linejoin="round"/>
    <path d="M 221 256 C 232 218, 244 176, 256 140" stroke-width="4" opacity="0.85"/>
  </g>

  <!-- 時 — time -->
  <text x="322" y="272" text-anchor="middle"
        font-family="Noto Serif CJK SC, serif" font-weight="bold" font-size="46"
        fill="url(#olive)">時</text>
</svg>
